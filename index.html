<style>

@media(max-width:860px){

<script>
const G={AC:'Ativo Circulante',ANC:'Ativo Não Circulante',PC:'Passivo Circulante',PNC:'Passivo Não Circulante',PL:'Patrimônio Líquido',REC:'Receita',DED:'Deduções da Receita',CMV:'Custos (CMV/CPV/CSP)',DESP:'Despesas Operacionais',IR:'IR e CSLL'};

const mk=()=>PLAN.map(([c,n,g,nat])=>({c,n,g,nat:nat||(DG.includes(g)?'D':'C')}));
let S=null,tab='ini',armed=false,ed=null,sel={dia:1,rz:1,bal:1,dre:1,bp:1};
try{S=JSON.parse(localStorage.getItem('razao')||'null')}catch(e){}
if(!S||!S.emp)S={cur:null,emp:{}};
const save=()=>{try{localStorage.setItem('razao',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const E=()=>S.emp[S.cur];
const fd=s=>s?s.split('-').reverse().join('/'):'';
const num=s=>{s=String(s).trim();return s.includes(',')?parseFloat(s.replace(/\./g,'').replace(',','.')):parseFloat(s)};
const nm=(e,c)=>{const a=e.contas.find(x=>x.c===c);return a?a.c+' · '+esc(a.n):esc(c)};
const msg=t=>{$('#msg').textContent=t};

function saldos(e){const m={};e.contas.forEach(a=>m[a.c]={a,d:0,c:0,md:[],mc:[]});
 e.lan.forEach(l=>{if(m[l.deb]){m[l.deb].d+=l.v;m[l.deb].md.push(l.v)}if(m[l.cre]){m[l.cre].c+=l.v;m[l.cre].mc.push(l.v)}});
 Object.values(m).forEach(x=>x.s=x.a.nat==='D'?x.d-x.c:x.c-x.d);return m}
const res=m=>Object.values(m).reduce((s,x)=>{const g=x.a.g;return g==='REC'?s+x.c-x.d:DG.slice(2).includes(g)?s-(x.d-x.c):s},0);
function sec(m,g,sg,title,extra){const it=Object.values(m).filter(x=>x.a.g===g&&(x.d||x.c)).map(x=>[x.a.n,sg*(x.d-x.c)]);
 if(extra&&extra[1])it.push(extra);const t=it.reduce((s,i)=>s+i[1],0);
 return{t,it,h:`<tr class="sub"><td>${title}</td><td>${R(t)}</td></tr>`+it.map(i=>`<tr><td class="ind">${esc(i[0])}</td><td class="${i[1]<0?'neg':''}">${R(i[1])}</td></tr>`).join('')}}
const tot=(l,v)=>`<tr class="tot"><td>${l}</td><td class="${v<0?'neg':''}">${R(v)}</td></tr>`;

function novo(){const n=$('#nn').value.trim();if(!n)return $('#nn').focus();const id='e'+Date.now();S.emp[id]={nome:n,contas:mk(),lan:[]};S.cur=id;tab='ini';save();render()}
function del(b){if(!armed){armed=true;b.textContent='Confirmar exclusão';return}armed=false;delete S.emp[S.cur];S.cur=Object.keys(S.emp)[0]||null;tab='ini';save();render()}
function go(t){tab=t;render();window.scrollTo(0,0)}
function add(){const e=E(),v=num($('#v').value),deb=$('#deb').value,cre=$('#cre').value;
 if(!(v>0))return msg('Informe um valor maior que zero.');
 if(deb===cre)return msg('Débito e crédito precisam ser contas diferentes.');
 e.lan.push({id:Date.now(),d:$('#d').value,h:$('#h').value.trim(),deb,cre,v});save();render()}
function rm(id){const e=E();e.lan=e.lan.filter(l=>l.id!==id);save();render()}
function addc(){const e=E(),c=$('#nc').value.trim(),n=$('#cn').value.trim(),g=$('#ng').value,r=$('#nr').checked,a=ed!==null?e.contas.find(x=>x.c===ed):null;
 if(!c||!n)return msg('Informe o código e o nome da conta.');
 if(e.contas.some(x=>x.c===c&&x!==a))return msg('Já existe uma conta com esse código.');
 const b=DG.includes(g)?'D':'C',nat=r?(b==='D'?'C':'D'):b;if(a){e.lan.forEach(l=>{if(l.deb===a.c)l.deb=c;if(l.cre===a.c)l.cre=c});Object.assign(a,{c,n,g,nat})}else e.contas.push({c,n,g,nat});ed=null;e.contas.sort((a,b)=>a.c.localeCompare(b.c,'pt',{numeric:true}));save();render()}
function ex(){const e=E();let id=Date.now();
 [['2026-01-02','Integralização de capital em dinheiro','1.1.1','3.1',100000],['2026-01-05','Compra de mercadorias a prazo','1.1.4','2.1.1',40000],['2026-01-10','Venda de mercadorias à vista','1.1.1','4.1',60000],['2026-01-10','Baixa do estoque vendido','5.1','1.1.4',25000],['2026-01-10','Impostos sobre a venda','4.2','2.1.3',6000],['2026-01-31','Pagamento de salários','6.1','1.1.1',9000],['2026-01-31','Depreciação do mês','6.3','1.2.2',1000]]
 .forEach(r=>e.lan.push({id:id++,d:r[0],h:r[1],deb:r[2],cre:r[3],v:r[4]}));save();render()}

/* ---------- Tela inicial ---------- */
const ICO={
 lan:'<path d="M12 5v14M5 12h14"/>',
 est:'<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
 con:'<path d="M4 6h16M4 12h16M4 18h10"/>',
 dia:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
 rz:'<path d="M4 7h16M12 7v13"/>',
 bal:'<path d="M12 4v16M6 20h12M4 8h16"/><path d="M7 8l-3 6h6zM17 8l-3 6h6z"/>',
 dre:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
 bp:'<rect x="3" y="4" width="8" height="16" rx="1"/><rect x="13" y="4" width="8" height="16" rx="1"/>',
 exp:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'
};
const COL={lan:'#1c7c4a',est:'#a8692b',con:'#2f6fd0',dia:'#8e3b46',rz:'#6a4fc9',bal:'#0f8b8d',dre:'#d4881e',bp:'#b8861f',exp:'#2f6fd0'};
const ic=(k,s)=>`<svg viewBox="0 0 24 24" width="${s||28}" height="${s||28}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO[k]}</svg>`;
function resumo(e){const m=saldos(e),ll=res(m),A=sec(m,'AC',1,'').t+sec(m,'ANC',1,'').t,P=sec(m,'PC',-1,'').t+sec(m,'PNC',-1,'').t+sec(m,'PL',-1,'',['Resultado do Exercício',ll]).t;
 return{ll,A,fecha:Math.abs(A-P)<0.005}}
function app(k,lb,vl,tt){return `<button class="app" onclick="go('${k}')" title="${esc(tt)}" style="--c:${COL[k]}"><span class="tile">${ic(k)}</span><span class="lb">${lb}</span>${vl?`<span class="vl">${esc(vl)}</span>`:''}</button>`}
function poster(e){const r=e?resumo(e):null,n=e?e.lan.length:0,nome=e?e.nome:'Sua empresa',
 ini=esc(nome.replace(/[^A-Za-zÀ-ÿ0-9 ]/g,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?'),
 ll=r?r.ll:0,neg=ll<0,st=!e?['aguardando','']:!n?['sem lançamentos','']:r.fecha?['balanço fecha','ok']:['não fecha','bad'];
 return `<div class="poster"><i class="tape"></i><i class="tape"></i><div class="pt">PROCURADA</div><div class="pm">viva e, de preferência, no azul</div><div class="ph"><span>${ini}</span></div><div class="pn">${esc(nome)}</div><div class="pl">${neg?'prejuízo':'recompensa'}</div><div class="pv ${neg?'neg2':''}">${R(Math.abs(ll))}</div><div class="pa">tesouro (ativo): ${R(r?r.A:0)}</div><div class="stamp ${st[1]}">${st[0]}</div></div>`}
function stage(e){const h=new Date().getHours(),sd=h<5?'boa madrugada':h<12?'bom dia':h<18?'boa tarde':'boa noite';
 const extra=!e?'<p class="mono sub">crie sua primeira empresa no topo da página</p>':!e.lan.length?`<p class="cta"><button onclick="go('lan')">fazer o primeiro lançamento</button></p>`:'';
 return `<section class="stage"><div class="dots" aria-hidden="true"></div><div class="sl"><p class="mono hi">${sd},</p><h2 class="big">Lançamentos viram</h2><p class="mono sub">contabilidade</p></div><div class="sr"><h2 class="big pix">Balanço</h2><p class="mono sub">agora: razonetes, DRE e balanço</p></div><div class="sp">${poster(e)}${extra}</div></section>`}
function tIni(e){const n=e.lan.length,ne=(e.est&&e.est.itens||[]).length,pl=(k,s,p)=>k+(k===1?s:p);
 return stage(e)

 h+=`<div class="card"><div class="form"><label>Data<input type="date" id="edt" value="${hoje}"></label><label>Operação<select id="etp"><option value="E">Entrada (compra)</option><option value="S">Saída (venda)</option></select></label><label>Quantidade<input id="eq" inputmode="decimal" placeholder="10"></label><label>Valor unitário (R$)<input id="ev" inputmode="decimal" placeholder="5,00"></label><button onclick="eAdd()">Registrar</button></div>${mg}<p class="mut" style="font-size:13px;margin:6px 0 0">Na entrada, informe o custo unitário da compra. Na saída, informe o preço unitário de venda; o custo da saída é calculado pelo método escolhido.</p></div>`;
 const em=n=>`<td colspan="${n}"></td>`,sm='display:block;white-space:normal;min-width:120px';
 const rows=c.rows.map(r=>{const x=r.x,en=x.tipo==='E';
  return `<tr><td>${fd(x.d)}</td><td>${en?'Entrada':'Saída'}</td>`
  +(en?`<td class="n">${nf(x.q)}</td><td class="n">${R(x.v)}</td><td class="n">${R(r.e)}</td>${em(3)}`:`${em(3)}<td class="n">${nf(x.q)}</td><td class="n">${R(r.s.c)}</td><td class="n">${R(r.s.t)}<small class="mut" style="${sm}">${esc(r.s.det)}</small></td>`)
  +`<td class="n">${nf(r.sd.q)}</td><td class="n">${R(r.sd.c)}</td><td class="n">${R(r.sd.t)}</td>`
  +(en?em(3):`<td class="n">${R(x.v)}</td><td class="n">${R(r.vd.r)}</td><td class="n ${r.vd.l<0?'neg':''}">${R(r.vd.l)}</td>`)
  +`<td><button class="ghost" onclick="eRm(${x.id})" aria-label="Excluir movimentação">✕</button></td></tr>`}).join('');
 h+=`<div class="card"><table class="fx"><tr><th rowspan="2">Data</th><th rowspan="2">Operação</th><th colspan="3" class="c">Entradas</th><th colspan="3" class="c">Saídas (custo)</th><th colspan="3" class="c">Saldo</th><th colspan="3" class="c">Vendas</th><th rowspan="2"></th></tr>
 <tr><th class="n">Qtd</th><th class="n">Custo un.</th><th class="n">Total</th><th class="n">Qtd</th><th class="n">Custo un.</th><th class="n">CMV</th><th class="n">Qtd</th><th class="n">Custo un.</th><th class="n">Total</th><th class="n">Preço un.</th><th class="n">Receita</th><th class="n">Lucro bruto</th></tr>
 ${rows||'<tr><td colspan="15" class="mut">Nenhuma movimentação ainda. Registre a primeira entrada acima.</td></tr>'}</table></div>`;
 const lay=c.L.length?c.L.map((l,i)=>`<tr><td>${it.mt==='MPM'?'Custo médio':'Lote '+(i+1)}</td><td class="n">${nf(l.q)}</td><td class="n">${R(l.c)}</td><td class="n">${R(l.q*l.c)}</td></tr>`).join(''):'<tr><td colspan="4" class="mut">Estoque zerado.</td></tr>';
 const cm=['PEPS','UEPS','MPM'].map(k=>[k,calc(it,k)]).map(([k,v])=>`<tr${k===it.mt?' style="font-weight:600"':''}><td>${k}</td><td class="n">${R(v.t)}</td><td class="n">${R(v.cmv)}</td><td class="n">${R(v.rec-v.cmv)}</td></tr>`).join('');
 h+=`<div class="grid2"><div class="card"><b>${it.mt==='MPM'?'Estoque atual':'Lotes em estoque (do mais antigo ao mais novo)'}</b><table style="margin-top:8px"><tr><th></th><th class="n">Qtd</th><th class="n">Custo un.</th><th class="n">Total</th></tr>${lay}</table></div>
 <div class="card"><b>Comparação entre os métodos</b><table style="margin-top:8px"><tr><th>Método</th><th class="n">Estoque final</th><th class="n">CMV</th><th class="n">Lucro bruto</th></tr>${cm}</table></div></div>`;
 return h}

function bkp(){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-razao-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function rst(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.emp)throw 0;Object.assign(S.emp,d.emp);S.cur=S.cur&&S.emp[S.cur]?S.cur:Object.keys(S.emp)[0]||null;save();render();alert('Backup importado: '+Object.keys(d.emp).length+' empresa(s).')}catch(x){alert('Arquivo de backup inválido.')}};r.readAsText(f);inp.value=''}
function render(){armed=false;const ids=Object.keys(S.emp);
 $('#top').innerHTML=(ids.length?`<select aria-label="Empresa" onchange="S.cur=this.value;tab='ini';save();render()">${ids.map(i=>`<option value="${i}"${i===S.cur?' selected':''}>${esc(S.emp[i].nome)}</option>`).join('')}</select>`:'')+`<input id="nn" placeholder="Nome da empresa" aria-label="Nome da nova empresa"><button onclick="novo()">Criar empresa</button>`+(S.cur?`<button class="ghost" onclick="del(this)">Excluir empresa</button>`:'');
 if(!S.cur){$('#main').innerHTML=stage(null);return}
 const T={ini:['Início',tIni],lan:['Lançamentos',tLan],dia:['Diário',tDia],rz:['Razonetes',tRz],bal:['Balancete',tBal],dre:['DRE',tDre],bp:['Balanço Patrimonial',tBp],est:['Estoque',tEst],con:['Contas',tCon],exp:['Exportar PDF',tExp]};
 $('#main').innerHTML=(tab==='ini'?'':`<div class="tabs" role="tablist">${Object.entries(T).map(([k,v])=>`<button role="tab" class="${k===tab?'on':''}" onclick="go('${k}')">${v[0]}</button>`).join('')}</div>`)+(['dia','rz','bal','dre','bp'].includes(tab)?`<div class="bar"><button class="ghost" onclick="exportar(['${tab}'])">Exportar em PDF</button></div><p id="msg2"></p>`:'')+T[tab][1](E())}
$('#upd').textContent='atualizado em '+new Date().toLocaleDateString('pt-BR',{month:'2-digit',year:'2-digit'});
render();
